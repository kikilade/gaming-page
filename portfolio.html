<!doctype html>

<html>

<head>

<meta charset="UTF-8">

<title>My Graphic Design Portfolio</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Merriweather&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

    body {
        background: whitesmoke;
    }

    #page {
        width: 928px;
        min-height: 900px;
        background: white;
        margin: 0 auto;
        padding: 48px;
        border: 1px solid darkgray;
        box-shadow: 2px 3px 6px darkgray;
    }

    h1 {
        font: 700 40pt/1.2em 'Orbitron', sans-serif;
        text-align: center;
        text-shadow: 2px 3px 6px mediumpurple;
    }

    h2 {
        font: 14pt/1.4em 'Merriweather', serif;
        text-align: center;
        margin-bottom: 30px;
    }


    /* HOME BUTTON */

    .home-button {
        display: block;
        width: 200px;
        margin: 0 auto 40px auto;
        padding: 14px 20px;
        background: black;
        color: white;
        text-align: center;
        text-decoration: none;
        font: 700 14pt 'Orbitron', sans-serif;
        border-radius: 6px;
        box-shadow: 2px 3px 6px gray;
    }

    .home-button:hover {
        background: mediumpurple;
    }


    /* FLEXBOX PORTFOLIO */

    #portfolio {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 25px;
    }


    /* PORTFOLIO PIECES */

    figure {
        width: 250px;
        margin: 10px;
        text-align: center;
    }

    figure img {
        width: 200px;
        height: 300px;
        object-fit: cover;
        border: 1px solid dimgray;
        box-shadow: 2px 3px 6px darkgray;
    }

    figcaption {
        font: 12pt/1.4em 'Merriweather', serif;
        margin-top: 12px;
    }

    figcaption strong {
        font-family: 'Orbitron', sans-serif;
    }

</style>

</head>


<body>

<div id="page">


    <!-- TITLE -->

    <h1>My Design Portfolio</h1>

    <h2>A collection of my graphic design work</h2>


    <!-- HOME BUTTON -->

    <a class="home-button" href="index.html">
        Back to Home
    </a>


    <!-- FLEXBOX PORTFOLIO -->

    <div id="portfolio">


        <!-- GEOMETRIC DESIGN -->

        <figure>

            <a href="geometric-design.jpeg">

                <img src="geometric-thumb.jpeg"
                     alt="Colorful geometric character design">

            </a>

            <figcaption>
                <strong>Geometric Design</strong><br>
                Digital geometric illustration
            </figcaption>

        </figure>


        <!-- ITACHI POSTER -->

        <figure>

            <a href="itachi-poster.jpeg">

                <img src="itachi-thumb.jpeg"
                     alt="Red and black Itachi inspired poster">

            </a>

            <figcaption>
                <strong>Itachi Poster</strong><br>
                Digital poster design
            </figcaption>

        </figure>


        <!-- LOGO DESIGN -->

        <figure>

            <a href="logo-design.png">

                <img src="logo-thumb.jpeg"
                     alt="Black and white symmetrical logo design">

            </a>

            <figcaption>
                <strong>Logo Design</strong><br>
                Black and white logo exploration
            </figcaption>

        </figure>


    </div>

</div>

</body>

</html>
